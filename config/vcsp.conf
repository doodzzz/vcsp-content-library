# /etc/vcsp/vcsp.conf - VCSP external content library settings.
#
# Plain KEY="value" lines, read by deploy.sh (bash) and by both Python
# services. Do not use $variables or command substitution in values.
# After editing, run:  /opt/vcsp/deploy.sh install   (re-renders nginx/systemd)

# ---------------------------------------------------------------- identity
LIB_NAME="Enterprise Content Library"      # shown as the catalog/library name to subscribers
SERVER_FQDN="vcsp.example.local"           # DNS name subscribers use; goes into the TLS certificate
# PUBLIC_BASE_URL="https://vcsp.example.local"   # override when behind a load balancer

# ---------------------------------------------------------------- storage
# Library = DATA_ROOT/lib (served at /lib/), staging = DATA_ROOT/staging.
# Both live on the same filesystem so publishing is an atomic rename.
# Put DATA_ROOT on a dedicated data disk sized for all templates and ISOs.
# On Photon OS /srv is a link to /var/srv, so /srv/vcsp is really /var/srv/vcsp;
# deploy.sh resolves such links. lib/ and staging/ themselves must not be links.
DATA_ROOT="/srv/vcsp"
STATE_DIR="/var/lib/vcsp"

# ---------------------------------------------------------------- subscriber access
LIB_AUTH="basic"                 # basic | none. VCSP clients always sign in as user "vcsp".
LIB_ALLOW_CIDRS=""               # e.g. "10.10.20.0/24 10.10.30.15/32" (VCD cells, vCenters). Empty = any.

# ---------------------------------------------------------------- tenants
# Tenants are created with 'deploy.sh tenant-add NAME'; their settings live in
# /etc/vcsp/tenants/NAME/tenant.conf. This is the quota new tenants get when
# --quota-gb is not given.
TENANT_DEFAULT_QUOTA_GB="0"      # GiB per tenant (library + staging); 0 = unlimited

# ---------------------------------------------------------------- upload portal
ADMIN_ALLOW_CIDRS=""             # restrict who can reach /upload/. Empty = any.
# Origins allowed to show the portal inside a frame, i.e. the VMware Cloud Director
# address(es) users browse to, for the VCD UI plugin in vcd-plugin/. Empty = no framing.
EMBED_ALLOWED_ORIGINS=""         # e.g. "https://vcd.example.local https://vcd-dr.example.local"
ALLOWED_EXTENSIONS="ovf vmdk mf cert nvram iso ova"
UPLOAD_CHUNK_MB="64"             # size of each resumable upload request (1-512)
MAX_FILE_SIZE_GB="256"
MIN_FREE_SPACE_GB="20"           # uploads are refused if they would leave less than this free
VERIFY_MANIFEST="yes"            # check .mf SHA1/SHA256/SHA512 digests before publishing
OVA_EXTRACT="yes"                # unpack OVAs into OVF + disks (subscribers cannot deploy raw OVAs)
ALLOW_DELETE="yes"               # allow deleting items from the portal
STAGING_TTL_HOURS="72"           # abandoned partial uploads are removed after this long
UPLOAD_LISTEN="127.0.0.1"        # the backend only listens locally; nginx fronts it
UPLOAD_PORT="8080"

# ---------------------------------------------------------------- indexer (vcsp-index)
ETAG_MODE="stat"                 # stat (no file reads, fastest) | md5 | sha256 (content hash, cached)
SKIP_CERT="yes"                  # leave .cert files out of OVF items (make_vcsp_2018.py default)
SETTLE_SECONDS="120"             # files copied in manually must be unchanged this long before publishing
INDEX_INTERVAL="5min"            # systemd timer period for the safety-net full scan
HASH_WORKERS="0"                 # 0 = min(4, CPUs); used by md5/sha256 etags and manifest checks

# ---------------------------------------------------------------- web server and host
HTTP_REDIRECT="yes"              # listen on :80 and redirect to https
LISTEN_IPV6="no"
MANAGE_FIREWALL="yes"            # open 443 (and 80) in Photon's iptables and persist the rules
TLS_ORG="IT Infrastructure"      # O= of the generated certificate and CSR
